name: CI Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Run tests and build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean test build --stacktrace

      - name: Verify local autonomy without LLM access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-gametest/config
          cat > run-gametest/config/steve-common.toml <<'CONFIG'
          [autonomy]
          enabled = true
          mode = "GOAL_DRIVEN"
          localPlanning = true
          maxLlmCallsPerGoal = 0
          CONFIG
          ./gradlew runGameTestServer -PgameTestNamespaces=steve_local --stacktrace | tee local-gametest.log
          grep -F "All 8 required tests passed" local-gametest.log

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            local-gametest.log
            run-gametest/logs/
