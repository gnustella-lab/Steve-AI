name: Release compiled mod jar

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v1.8.0'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/update (for example, v1.5.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release asset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Resolve release version and notes
        id: release_metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="${REQUESTED_TAG#release/}"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH release tag" >&2
            exit 1
          fi
          notes_path="docs/releases/${tag_name}.md"
          test -s "$notes_path"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version=${tag_name#v}" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"
          echo "jar_path=build/libs/steve-ai-mod-${tag_name#v}.jar" >> "$GITHUB_OUTPUT"
          echo "checksum_path=build/libs/steve-ai-mod-${tag_name#v}.jar.sha256" >> "$GITHUB_OUTPUT"

      - name: Build release jar
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: ./gradlew clean build --stacktrace -Pmod_version="$RELEASE_VERSION"

      - name: Verify dedicated server runtime
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew runGameTestServer --stacktrace -Pmod_version="$RELEASE_VERSION" | tee gametest.log
          grep -E "All [1-9][0-9]* required tests passed" gametest.log

      - name: Verify release asset and checksum
        shell: bash
        env:
          RELEASE_JAR: ${{ steps.release_metadata.outputs.jar_path }}
        run: |
          set -euo pipefail
          test -s "$RELEASE_JAR"
          cd build/libs
          sha256sum "${RELEASE_JAR##*/}" > "${RELEASE_JAR##*/}.sha256"
          sha256sum -c "${RELEASE_JAR##*/}.sha256"

      - name: Preserve build and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            build/reports/tests/
            build/libs/*.jar
            gametest.log
            run-gametest/logs/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Steve AI ${{ steps.release_metadata.outputs.tag_name }}
          body_path: ${{ steps.release_metadata.outputs.notes_path }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release_metadata.outputs.jar_path }}
            ${{ steps.release_metadata.outputs.checksum_path }}
