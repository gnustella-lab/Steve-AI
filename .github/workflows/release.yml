name: Release compiled mod jar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create/update (for example, v1.5.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build release jar
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          fi
          ./gradlew clean build --stacktrace -Pmod_version="${tag_name#v}"

      - name: Verify dedicated server runtime
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          fi
          ./gradlew runGameTestServer --stacktrace -Pmod_version="${tag_name#v}" | tee gametest.log
          grep -E "All [1-9][0-9]* required tests passed" gametest.log

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          fi

          jar_path="build/libs/steve-ai-mod-${tag_name#v}.jar"
          if [ ! -f "${jar_path}" ]; then
            echo "Installable JAR was not produced at ${jar_path}" >&2
            exit 1
          fi

          sha256sum "${jar_path}" > "${jar_path}.sha256"

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "jar_path=${jar_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${jar_path}.sha256" >> "${GITHUB_OUTPUT}"
          echo "jar_name=$(basename "${jar_path}")" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Steve AI ${{ steps.release_metadata.outputs.tag_name }}
          body: |
            Steve AI 1.9.0 - Minecraft 26.3 port

            This release moves the mod to Minecraft Java Edition 26.3 (Wilderness Bound) with Forge 66.1.9, Java 25, ForgeGradle 7 and Gradle 9.7.1. It replaces the previous 1.20.1 / Forge 47 / Java 17 toolchain and is not compatible with older Minecraft versions.

            Changed
            - Migrated Minecraft API usage (Identifier, GuiGraphicsExtractor, new input events, event bus, data components, synched data, NBT codecs, recipe displays) to the 26.3 API.
            - Updated mod metadata to loader [66,) and Minecraft [26.3,26.4,); pack format 121.
            - Updated the GitHub Actions build and release workflows to Java 25 / Gradle 9.7.1.
            - Updated the launcher script and technical documentation to the 26.3 toolchain.

            Verification
            - GitHub Actions compiled main and test sources against forge 26.3-66.1.9 with `./gradlew clean test build`.
            - The dedicated Forge GameTest server completed its test batch and initialized the mod runtime.
            - Jar-in-Jar verification confirmed the installable artifact and all required bundled libraries.

            Installation
            - Install `${{ steps.release_metadata.outputs.jar_name }}` in your `mods` folder.
            - Do not use the `-slim.jar` artifact; it cannot run by itself.
            - Verify the download with the accompanying `.sha256` file.
          files: |
            ${{ steps.release_metadata.outputs.jar_path }}
            ${{ steps.release_metadata.outputs.checksum_path }}
