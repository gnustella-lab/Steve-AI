plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

version = (findProperty('mod_version') ?: '1.8.2').toString().replaceFirst('^v', '')
group = 'com.steve.ai'

base {
    archivesName = 'steve-ai-mod'
}

// Minecraft 26.1+ ships and requires Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Jar-in-Jar: external runtime libraries travel inside the installable mod jar.
jarJar.register()

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client') {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        register('server') {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            args '--nogui'
            jvmArgs '-Xmx1280M', '-Xms512M'
        }

        register('gameTestServer') {
            workingDir = layout.projectDirectory.dir('run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', (project.findProperty('gameTestNamespaces') ?: 'steve').toString()
            systemProperty 'forge.logging.console.level', 'info'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.9')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'

    // HTTP client and JSON are provided by Java 25 and Minecraft (Gson).

    // Resilience4j for fault tolerance (circuit breaker, retry, rate limiting, bulkhead).
    ['resilience4j-core', 'resilience4j-circuitbreaker', 'resilience4j-retry',
     'resilience4j-ratelimiter', 'resilience4j-bulkhead'].each { artifact ->
        implementation "io.github.resilience4j:${artifact}:2.1.0"
        jarJar("io.github.resilience4j:${artifact}:2.1.0") {
            jarJar.configure(it) { range = '[2.1.0,2.2.0)' }
        }
    }

    // Caffeine cache for LLM response caching.
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    jarJar('com.github.ben-manes.caffeine:caffeine:3.1.8') {
        jarJar.configure(it) { range = '[3.1.8,3.2.0)' }
    }

    // JUnit 5 for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
}

test {
    useJUnitPlatform()
    // These legacy unit tests assume 1.20.1 item NBT/defaults. On 26.3 they need a fully
    // initialized vanilla registry (item components, tags, recipe displays), which is only
    // available in the GameTest server runtime. Their behaviour is covered by GameTests.
    exclude '**/SteveInventoryTest.class'
    exclude '**/SteveInventorySurvivalTest.class'
    exclude '**/SteveInventoryToolSwapTest.class'
    exclude '**/SurvivalCraftingRequirementsTest.class'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.version
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    manifest {
        attributes([
            'Specification-Title': 'Steve AI Mod',
            'Specification-Vendor': 'Steve AI',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Steve AI'
        ])
    }
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
}

def requiredRuntimeJars = [
    'caffeine-3.1.8.jar',
    'resilience4j-core-2.1.0.jar',
    'resilience4j-circuitbreaker-2.1.0.jar',
    'resilience4j-retry-2.1.0.jar',
    'resilience4j-ratelimiter-2.1.0.jar',
    'resilience4j-bulkhead-2.1.0.jar'
]

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies that the main distributable JAR contains all runtime libraries.'
    dependsOn 'jarJar'

    doLast {
        def releaseJar = tasks.named('jarJar', Jar).get().archiveFile.get().asFile
        def expectedName = "${base.archivesName.get()}-${project.version}.jar"
        if (releaseJar.name != expectedName) {
            throw new GradleException(
                "The installable mod must be ${expectedName}, but Jar-in-Jar produced ${releaseJar.name}"
            )
        }

        def entries = [] as Set
        def zip = new java.util.zip.ZipFile(releaseJar)
        try {
            zip.entries().each { entries.add(it.name) }
        } finally {
            zip.close()
        }

        def requiredEntries = requiredRuntimeJars.collect { "META-INF/jarjar/${it}".toString() }
        requiredEntries.add('META-INF/jarjar/metadata.json')
        def missingEntries = requiredEntries.findAll { !entries.contains(it) }
        if (!missingEntries.isEmpty()) {
            def foundEntries = entries.findAll { it.startsWith('META-INF/jarjar/') }
            throw new GradleException(
                "Release JAR ${releaseJar} is missing runtime entries: ${missingEntries.join(', ')}; " +
                    "found: ${foundEntries.join(', ')}"
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyReleaseJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jarJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
