plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = (findProperty('mod_version') ?: '1.5.1').toString().replaceFirst('^v', '')
group = 'com.steve.ai'

base {
    archivesName = 'steve-ai-mod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Dependências externas precisam viajar dentro do mod de produção.
jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                steve {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                steve {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'steve'
            property 'forge.logging.console.level', 'info'

            mods {
                steve {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // HTTP client - Using Java 11+ built-in HttpClient (no external dependencies needed!)
    // JSON parsing - Minecraft already includes Gson

    // Resilience4j for fault tolerance (circuit breaker, retry, rate limiting, bulkhead)
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.1.0'
    minecraftLibrary 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    minecraftLibrary 'io.github.resilience4j:resilience4j-retry:2.1.0'
    minecraftLibrary 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    minecraftLibrary 'io.github.resilience4j:resilience4j-bulkhead:2.1.0'

    jarJar(group: 'io.github.resilience4j', name: 'resilience4j-core', version: '[2.1.0,2.2.0)') {
        transitive = false
        jarJar.pin(it, '2.1.0')
    }
    jarJar(group: 'io.github.resilience4j', name: 'resilience4j-circuitbreaker', version: '[2.1.0,2.2.0)') {
        transitive = false
        jarJar.pin(it, '2.1.0')
    }
    jarJar(group: 'io.github.resilience4j', name: 'resilience4j-retry', version: '[2.1.0,2.2.0)') {
        transitive = false
        jarJar.pin(it, '2.1.0')
    }
    jarJar(group: 'io.github.resilience4j', name: 'resilience4j-ratelimiter', version: '[2.1.0,2.2.0)') {
        transitive = false
        jarJar.pin(it, '2.1.0')
    }
    jarJar(group: 'io.github.resilience4j', name: 'resilience4j-bulkhead', version: '[2.1.0,2.2.0)') {
        transitive = false
        jarJar.pin(it, '2.1.0')
    }

    // Caffeine cache for LLM response caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    minecraftLibrary 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    jarJar(group: 'com.github.ben-manes.caffeine', name: 'caffeine', version: '[3.1.8,3.2.0)') {
        transitive = false
        jarJar.pin(it, '3.1.8')
    }


    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.version
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    manifest {
        attributes([
            'Specification-Title': 'Steve AI Mod',
            'Specification-Vendor': 'Steve AI',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Steve AI'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
}

def requiredRuntimeJars = [
    'caffeine-3.1.8.jar',
    'resilience4j-core-2.1.0.jar',
    'resilience4j-circuitbreaker-2.1.0.jar',
    'resilience4j-retry-2.1.0.jar',
    'resilience4j-ratelimiter-2.1.0.jar',
    'resilience4j-bulkhead-2.1.0.jar'
]

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies that the main distributable JAR contains all runtime libraries.'
    dependsOn 'reobfJarJar'

    doLast {
        def releaseJar = tasks.named('jarJar', Jar).get().archiveFile.get().asFile
        def expectedName = "${base.archivesName.get()}-${project.version}.jar"
        if (releaseJar.name != expectedName) {
            throw new GradleException(
                "The installable mod must be ${expectedName}, but Jar-in-Jar produced ${releaseJar.name}"
            )
        }

        def entries = [] as Set
        def zip = new java.util.zip.ZipFile(releaseJar)
        try {
            zip.entries().each { entries.add(it.name) }
        } finally {
            zip.close()
        }

        def requiredEntries = requiredRuntimeJars.collect { "META-INF/jarjar/${it}".toString() }
        requiredEntries.add('META-INF/jarjar/metadata.json')
        def missingEntries = requiredEntries.findAll { !entries.contains(it) }
        if (!missingEntries.isEmpty()) {
            def foundEntries = entries.findAll { it.startsWith('META-INF/jarjar/') }
            throw new GradleException(
                "Release JAR ${releaseJar} is missing runtime entries: ${missingEntries.join(', ')}; " +
                    "found: ${foundEntries.join(', ')}"
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyReleaseJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jarJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

